# SPA Registry — values overlay for the openg2p-registry chart.
#
# This chart has no templates; it deploys the openg2p-registry subchart (pinned
# in Chart.yaml, aliased `registry`) with the overrides below. Install:
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-spa-registry
#     helm install spa-registry ./helm/openg2p-spa-registry
#
# Two kinds of override:
#   * global.*    — Helm propagates these to the subchart (and its subcharts).
#   * registry.*  — values for the openg2p-registry subchart itself.
# Everything not set here (all service wiring, keycloak/iam, db-seed machinery,
# id-generator, demo users) is inherited from the subchart defaults.

# ── Globals (propagate to the openg2p-registry subchart) ──────────────────────
global:
  registryVariant: 'spa-registry'
  # Ingress host for this registry. Overrides the subchart's generic default.
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  
  # Built staff-ui image from ui/staff-ui (upstream + overrides/)
  staffUi:
    image:
      repository: openg2p/openg2p-spa-registry-staff-ui
      tag: 0.0.0-develop

  # Farmer-built images (each FROM the matching openg2p-registry base image).
  # CI rewrites these tags to the freshly built farmer version (lockstep); the
  # base image they extend is pinned by the openg2p-registry dependency version.
  staffApi:
    image:
      repository: openg2p/openg2p-spa-registry-staff-api
      tag: 0.0.0-develop
  partnerApi:
    image:
      repository: openg2p/openg2p-spa-registry-partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: openg2p/openg2p-spa-registry-celery
      tag: 0.0.0-develop
  celeryBeat:
    image:
      repository: openg2p/openg2p-spa-registry-celery
      tag: 0.0.0-develop
    envVars:
      # TEMPORARY OVERRIDE of the platform chart default, pending the upstream fix.
      # -Q celery is required, not cosmetic. This pod runs the scheduler AND the worker
      # that executes the *_beat_producer tasks it emits; those are published to the
      # default "celery" queue, and the celery-worker pod only consumes
      # registry_worker_queue. Launched via run_celery.py's app.start(argv=...) with
      # "worker --beat" and no -Q, the worker prints its banner and "ready" but never
      # consumes a message: producer tasks pile up on "celery" forever (44k in 15h on
      # qa), nothing reaches registry_worker_queue, and every periodic job silently
      # stops — intake ingest, deduplication, completion scores, export, outgest. The
      # visible symptom is db-seed failing with "row ... not ingested within 180s".
      # Remove once the platform chart ships this default.
      CELERY_OPTS: "worker --beat -Q celery --loglevel=info --schedule=/tmp/celery-beat-schedule.db"
  dbSeed:
    image:
      repository: openg2p/openg2p-spa-registry-db-seed
      tag: 0.0.0-develop
    # The subchart defaults these OFF (minimal reference registry). Farmer ships
    # demo records/geo/images, so turn the db-seed loaders on. NB these are
    # `dbSeed.*`, not `global.*` — the db-seed Job reads .Values.dbSeed.load*
    # and there is no global fallback, so setting them under global is inert.
    loadGeoData: false
    loadSampleData: false
    loadImages: false
    loadTemplates: false
    intakeSeed:
      submitUser: alex.carter
      approver1: alex.carter
      approver2: nina.patel
      maxHouseholds: 25
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

  # Name of this registry's tile in IAM. The roles/permissions catalog itself is
  # registry-agnostic and comes from the subchart.
  iamRegister:
    applicationDescription: "SPA Registry"
    # Rancher skips Helm hooks. Null these so the Job/ConfigMap are regular
    # resources (same as commons does for master-data / AWE / PM).
    annotations: null
    payloadAnnotations: null

  # Functional-ID pools, one per register. The subchart defaults to the REFERENCE
  # registry's registers (individual + household), so the farmer register must be
  # declared here. NB Helm merges maps, so `individual` is inherited too and an
  # unused pool is provisioned for it — harmless, and a parent `null` cannot
  # remove a subchart default.
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          beneficiary:
            idLength: 12

  # beneApi is consumed as-is from the openg2p-registry base images
  # (subchart defaults already point at openg2p/openg2p-registry-*), so they are
  # intentionally not overridden.

  # ── Farmer e2e sanity suite (image built here; Set 2 field tests) ───────────
  # The subchart ships the reference (Individual) sanity values; override them
  # for the Farmer register. Behaviour toggles (runE2e/failOnError) keep the
  # subchart defaults.
  sanity:
    enabled: true
    image:
      repository: openg2p/openg2p-spa-registry-sanity-tests
      tag: 0.0.0-develop
    regType: Beneficiary
    regRecordType: 'spdci-extensions-dci:Beneficiary'
    searchText: SANITY-SPA-0001
    dataScopes: "beneficiary"
    deniedScopes: ""
    farmerRegisterId: a0000000-0000-4000-8000-000000000101
    crTabId: "beneficiary_tab"
    crSectionId: "beneficiary_identity_section"
